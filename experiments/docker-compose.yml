# Four-experiment tree-segmentation study. Every service shares ./data and
# ./results (bind mounts), so the chunk built once by `prep` is the identical
# input to all four experiments. Orchestrated in order by ../run_experiments.sh
# (which calls `docker compose run` per stage); the depends_on conditions also
# let you run `docker compose up` and have it self-order.
#
# GPU services need the NVIDIA Container Toolkit on the host.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ---- Stage 0: build the one shared chunk (CPU) -------------------------
  prep:
    build: { context: ., dockerfile: prep/Dockerfile }
    image: carbonpoly/prep
    env_file: [.env]
    environment:
      DATA_DIR: /data
      RESULTS_DIR: /results
    volumes:
      - ./data:/data
      - ./results:/results
    command: ["python", "/app/prepare_chunk.py"]

  # ---- Stage 1: Sonata vegetation mask (GPU) -----------------------------
  # trains the trees+bushes head (cached) then writes chunk_masked_local.laz
  sonata:
    <<: *gpu
    build: { context: ., dockerfile: sonata/Dockerfile }
    image: carbonpoly/sonata
    env_file: [.env]
    environment:
      DATA_DIR: /data
      RESULTS_DIR: /results
    volumes:
      - ./data:/data
      - ./results:/results
    depends_on:
      prep: { condition: service_completed_successfully }
    command: ["bash", "-lc", "python /app/train_head.py && python /app/run_mask.py"]

  # ---- Experiments 1 & 3: TreeLearn (GPU) --------------------------------
  treelearn_raw:
    <<: *gpu
    build: { context: ., dockerfile: treelearn/Dockerfile }
    image: carbonpoly/treelearn
    env_file: [.env]
    environment: { EXPERIMENT: raw, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    depends_on:
      prep: { condition: service_completed_successfully }

  treelearn_masked:
    <<: *gpu
    image: carbonpoly/treelearn
    env_file: [.env]
    environment: { EXPERIMENT: masked, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    depends_on:
      treelearn_raw: { condition: service_started }
      sonata: { condition: service_completed_successfully }

  # ---- Experiments 2 & 4: SegmentAnyTree (official image, GPU) -----------
  # Reads a folder of clouds from bucket_in_folder, writes to bucket_out_folder.
  # The run script stages exactly one chunk into each *_in folder first.
  segmentanytree_raw:
    <<: *gpu
    image: ${SAT_IMAGE:-maciekwielgosz/segment-any-tree:latest}
    volumes:
      - ./data/sat/raw_in:/home/nibio/mutable-outside-world/bucket_in_folder
      - ./data/sat/raw_out:/home/nibio/mutable-outside-world/bucket_out_folder

  segmentanytree_masked:
    <<: *gpu
    image: ${SAT_IMAGE:-maciekwielgosz/segment-any-tree:latest}
    volumes:
      - ./data/sat/masked_in:/home/nibio/mutable-outside-world/bucket_in_folder
      - ./data/sat/masked_out:/home/nibio/mutable-outside-world/bucket_out_folder

  # ---- BaseWalker: iterative tree-base detection (own study track) -------
  # Image builds FROM carbonpoly/sonata — build the sonata service first
  # (the run scripts' bw targets do). prep is CPU (normals + CSF DEM);
  # train/infer need the GPU.
  basewalker_prep:
    build: { context: ., dockerfile: basewalker/Dockerfile }
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/prep_scene.py"]

  basewalker_train:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/train.py"]

  basewalker_infer:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/infer.py"]

  # qualitative renders: detections vs RTK ground truth on four map chunks
  basewalker_render:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_chunks.py"]

  # ---- GeoWalker: walking a through-cloud distance field (own track) ----
  # Image builds FROM carbonpoly/basewalker (which builds FROM carbonpoly/sonata)
  # and reuses its scene artifacts in data/basewalker/. The field stage is pure
  # numpy/scipy, so it needs no GPU; train/infer do.
  geowalker_field:
    build: { context: ., dockerfile: geowalker/Dockerfile }
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/geodesic.py"]

  # GPU preflight, ~5 s: proves the card reaches a container AND that kernels
  # actually run on it (on sm_120 the availability flag alone can lie).
  gpu_check:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    command: ["bash", "-lc", "nvidia-smi; echo; python /app/geowalker/gpu_check.py"]

  # CPU self-check: synthetic geometry only, no data, no GPU, ~10 s
  geowalker_test:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/tests/test_geowalker.py"]

  geowalker_train:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/train.py"]

  geowalker_infer:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/infer.py"]

  # why is recall what it is? decomposes it into walking / NMS / threshold
  geowalker_diag:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/diagnose.py"]

  # canopy height: derives the annotators' height cut from the labels and says
  # how many detections stand under something too short to have been one (CPU)
  geowalker_height:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/height.py"]

  # the control: classical, training-free tree detection on the same ground,
  # scored by the same matcher. CPU, minutes. Answers "is the network actually
  # beating a density peak and a canopy local maximum?" -- which nothing in this
  # repo had ever measured.
  geowalker_baseline:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/baseline.py"]

  # can a dedicated head tell a stem from a bush? mines the walker's own false
  # positives as hard negatives, trains the binary decision, re-scores the real
  # val endpoints with it and reports whether that clears the bar
  geowalker_head:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/treehead.py"]

  # ---- StemNet: a dense chunk model, no walk ------------------------------
  # Per point: is this a tree stem, and the horizontal offset to its base. One
  # encoder pass per window over the breast-height slice, then the shifted
  # points are clustered -- so a detection's score is the vote mass that agreed
  # on it. Shares only the prepared scene, the encoder and the matcher with the
  # walker tracks; everything shared lives in common/.
  stemnet_build:
    build: { context: ., dockerfile: stemnet/Dockerfile }
    image: carbonpoly/stemnet
    command: ["true"]

  # CPU self-check: band, window tiling, targets, votes, dense read-out, with
  # Sonata mocked. Seconds, no data, no GPU.
  stemnet_test:
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/tests/test_stemnet.py"]

  stemnet_train:
    <<: *gpu
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet/train.py"]

  stemnet_infer:
    <<: *gpu
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet/infer.py"]

  # ---- StemNet v2: rebuilt from scratch (own image, own data dir) ---------
  # Step 0: measure the raw scan and the stem map. CPU only. Writes a tile
  # cache of ~12 bytes per raw point to data/stemnet_v2/cache.
  v2_measure:
    build: { context: ., dockerfile: stemnet_v2/Dockerfile }
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/measure.py"]

  # synthetic scan with known answers; seconds, no data
  v2_test:
    image: carbonpoly/stemnet_v2
    environment: { DATA_DIR: /tmp/data, RESULTS_DIR: /tmp/results }
    command: ["sh", "-c", "python /app/tests/test_stemnet_v2_measure.py && python /app/tests/test_stemnet_v2_grid.py && python /app/tests/test_stemnet_v2_features.py && python /app/tests/test_stemnet_v2_circles.py && python /app/tests/test_stemnet_v2_splits.py"]

  # Prep part 1: the raw scan on Sonata's 0.02 m grid, one real point per voxel,
  # colour kept, coordinates in the shared frame. CPU only. Scratch space up to
  # 16 bytes per raw point while it runs; deleted at the end.
  v2_grid:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_grid.py"]

  # Prep part 2: the paper's 12 covariance features, 20 nearest neighbours, per
  # point of the 0.02 m grid. CPU only, all cores.
  v2_features:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_features.py"]

  # Prep part 3: the derived stem base of every surveyed tree — a circle fit
  # through the survey point, layer by layer up the trunk. CPU only.
  v2_circles:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_circles.py"]

  # Prep part 4: train / val / test / buffer raster, occupancy, one split label
  # per survey row. CPU only, minutes.
  v2_splits:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_splits.py"]

  # ---- SegmentAnyTree result rendering (CPU, reuses prep image) ----------
  sat_render_raw:
    image: carbonpoly/prep
    environment: { EXPERIMENT: raw, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_sat_output.py"]

  sat_render_masked:
    image: carbonpoly/prep
    environment: { EXPERIMENT: masked, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_sat_output.py"]
