# Four-experiment tree-segmentation study. Every service shares ./data and
# ./results (bind mounts), so the chunk built once by `prep` is the identical
# input to all four experiments. Orchestrated in order by ../run_experiments.sh
# (which calls `docker compose run` per stage); the depends_on conditions also
# let you run `docker compose up` and have it self-order.
#
# GPU services need the NVIDIA Container Toolkit on the host.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ---- Stage 0: build the one shared chunk (CPU) -------------------------
  prep:
    build: { context: ., dockerfile: prep/Dockerfile }
    image: carbonpoly/prep
    env_file: [.env]
    environment:
      DATA_DIR: /data
      RESULTS_DIR: /results
    volumes:
      - ./data:/data
      - ./results:/results
    command: ["python", "/app/prepare_chunk.py"]

  # ---- Stage 1: Sonata vegetation mask (GPU) -----------------------------
  # trains the trees+bushes head (cached) then writes chunk_masked_local.laz
  sonata:
    <<: *gpu
    build: { context: ., dockerfile: sonata/Dockerfile }
    image: carbonpoly/sonata
    env_file: [.env]
    environment:
      DATA_DIR: /data
      RESULTS_DIR: /results
    volumes:
      - ./data:/data
      - ./results:/results
    depends_on:
      prep: { condition: service_completed_successfully }
    command: ["bash", "-lc", "python /app/train_head.py && python /app/run_mask.py"]

  # ---- Experiments 1 & 3: TreeLearn (GPU) --------------------------------
  treelearn_raw:
    <<: *gpu
    build: { context: ., dockerfile: treelearn/Dockerfile }
    image: carbonpoly/treelearn
    env_file: [.env]
    environment: { EXPERIMENT: raw, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    depends_on:
      prep: { condition: service_completed_successfully }

  treelearn_masked:
    <<: *gpu
    image: carbonpoly/treelearn
    env_file: [.env]
    environment: { EXPERIMENT: masked, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    depends_on:
      treelearn_raw: { condition: service_started }
      sonata: { condition: service_completed_successfully }

  # ---- Experiments 2 & 4: SegmentAnyTree (official image, GPU) -----------
  # Reads a folder of clouds from bucket_in_folder, writes to bucket_out_folder.
  # The run script stages exactly one chunk into each *_in folder first.
  segmentanytree_raw:
    <<: *gpu
    image: ${SAT_IMAGE:-maciekwielgosz/segment-any-tree:latest}
    volumes:
      - ./data/sat/raw_in:/home/nibio/mutable-outside-world/bucket_in_folder
      - ./data/sat/raw_out:/home/nibio/mutable-outside-world/bucket_out_folder

  segmentanytree_masked:
    <<: *gpu
    image: ${SAT_IMAGE:-maciekwielgosz/segment-any-tree:latest}
    volumes:
      - ./data/sat/masked_in:/home/nibio/mutable-outside-world/bucket_in_folder
      - ./data/sat/masked_out:/home/nibio/mutable-outside-world/bucket_out_folder

  # ---- BaseWalker: iterative tree-base detection (own study track) -------
  # Image builds FROM carbonpoly/sonata — build the sonata service first
  # (the run scripts' bw targets do). prep is CPU (normals + CSF DEM);
  # train/infer need the GPU.
  basewalker_prep:
    build: { context: ., dockerfile: basewalker/Dockerfile }
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/prep_scene.py"]

  basewalker_train:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/train.py"]

  basewalker_infer:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/infer.py"]

  # qualitative renders: detections vs RTK ground truth on four map chunks
  basewalker_render:
    <<: *gpu
    image: carbonpoly/basewalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_chunks.py"]

  # ---- GeoWalker: walking a through-cloud distance field (own track) ----
  # Image builds FROM carbonpoly/basewalker (which builds FROM carbonpoly/sonata)
  # and reuses its scene artifacts in data/basewalker/. The field stage is pure
  # numpy/scipy, so it needs no GPU; train/infer do.
  geowalker_field:
    build: { context: ., dockerfile: geowalker/Dockerfile }
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/geodesic.py"]

  # GPU preflight, ~5 s: proves the card reaches a container AND that kernels
  # actually run on it (on sm_120 the availability flag alone can lie).
  gpu_check:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    command: ["bash", "-lc", "nvidia-smi; echo; python /app/geowalker/gpu_check.py"]

  # CPU self-check: synthetic geometry only, no data, no GPU, ~10 s
  geowalker_test:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/tests/test_geowalker.py"]

  geowalker_train:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/train.py"]

  geowalker_infer:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/infer.py"]

  # why is recall what it is? decomposes it into walking / NMS / threshold
  geowalker_diag:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/diagnose.py"]

  # canopy height: derives the annotators' height cut from the labels and says
  # how many detections stand under something too short to have been one (CPU)
  geowalker_height:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/height.py"]

  # the control: classical, training-free tree detection on the same ground,
  # scored by the same matcher. CPU, minutes. Answers "is the network actually
  # beating a density peak and a canopy local maximum?" -- which nothing in this
  # repo had ever measured.
  geowalker_baseline:
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/baseline.py"]

  # can a dedicated head tell a stem from a bush? mines the walker's own false
  # positives as hard negatives, trains the binary decision, re-scores the real
  # val endpoints with it and reports whether that clears the bar
  geowalker_head:
    <<: *gpu
    image: carbonpoly/geowalker
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/geowalker/treehead.py"]

  # ---- StemNet: a dense chunk model, no walk ------------------------------
  # Per point: is this a tree stem, and the horizontal offset to its base. One
  # encoder pass per window over the breast-height slice, then the shifted
  # points are clustered -- so a detection's score is the vote mass that agreed
  # on it. Shares only the prepared scene, the encoder and the matcher with the
  # walker tracks; everything shared lives in common/.
  stemnet_build:
    build: { context: ., dockerfile: stemnet/Dockerfile }
    image: carbonpoly/stemnet
    command: ["true"]

  # CPU self-check: band, window tiling, targets, votes, dense read-out, with
  # Sonata mocked. Seconds, no data, no GPU.
  stemnet_test:
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/tests/test_stemnet.py"]

  stemnet_train:
    <<: *gpu
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet/train.py"]

  stemnet_infer:
    <<: *gpu
    image: carbonpoly/stemnet
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet/infer.py"]

  # ---- StemNet v2: rebuilt from scratch (own image, own data dir) ---------
  # Step 0: measure the raw scan and the stem map. CPU only. Writes a tile
  # cache of ~12 bytes per raw point to data/stemnet_v2/cache.
  v2_measure:
    build: { context: ., dockerfile: stemnet_v2/Dockerfile }
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/measure.py"]

  # synthetic scan with known answers; seconds, no data
  v2_test:
    image: carbonpoly/stemnet_v2
    environment: { DATA_DIR: /tmp/data, RESULTS_DIR: /tmp/results }
    command: ["sh", "-c", "python /app/tests/test_stemnet_v2_measure.py && python /app/tests/test_stemnet_v2_grid.py && python /app/tests/test_stemnet_v2_features.py && python /app/tests/test_stemnet_v2_bases.py && python /app/tests/test_stemnet_v2_splits.py && python /app/tests/test_stemnet_v2_export.py && python /app/tests/test_stemnet_v2_labels.py && python /app/tests/test_stemnet_v2_semantic.py"]

  # Prep part 1: the raw scan on Sonata's 0.02 m grid, one real point per voxel,
  # colour kept, coordinates in the shared frame. CPU only. Scratch space up to
  # 16 bytes per raw point while it runs; deleted at the end.
  v2_grid:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_grid.py"]

  # Prep part 2: the paper's 12 covariance features, 20 nearest neighbours, per
  # point of the 0.02 m grid. CPU only, all cores.
  v2_features:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_features.py"]

  # Prep part 3: tree bases = survey point + the measured survey->scan shift,
  # audited per block and per 100 m area against the scan's vertical surfaces.
  v2_bases:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_bases.py"]

  # Prep part 4: train / val / test / buffer raster, occupancy, one split label
  # per survey row. CPU only, minutes.
  v2_splits:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_splits.py"]

  # Prep part 5: per-point labels — close to a tree base (gate) and the offset
  # to it. CPU, minutes.
  v2_labels:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_labels.py"]

  # Prep part 5b: tree / non-tree labels per grid point, carried over from
  # data/raw/campus_pred_B24.laz (ground-removed, height above ground). CPU,
  # tens of minutes. Skips itself when already up to date. No file in data/raw:
  # downloads it first from Kaggle (brkdrd/campus-data-tree-no-tree-split, public).
  v2_semantic:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_semantic.py"]

  # Prep part 6: the training cache — train/val tiles sorted into 1 m cells
  # so a crop reads only its own points. CPU, ~10 min, ~20 GB. Skips itself
  # when already up to date.
  v2_cache:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/prep_cache.py"]

  # Cut the scan out around 80 survey points (40 girth-surveyed, 40 random) into
  # one file, for inspecting survey points against trunks. CPU, minutes.
  v2_export:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/export_columns.py"]

  # Look at the grid points in squares across the campus: pixel images from
  # above / below / RGB / side, white = no point. CPU, minutes.
  v2_view:
    image: carbonpoly/stemnet_v2
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/view_squares.py"]

  # Training: frozen Sonata + the gate/offset head. GPU image built FROM
  # carbonpoly/sonata (build `sonata` first; the v2_train target does).
  v2_train_build:
    build: { context: ., dockerfile: stemnet_v2/Dockerfile.gpu }
    image: carbonpoly/stemnet_v2_gpu
    command: ["true"]

  # CPU self-check with a stand-in encoder: crops, augmentation, the inference
  # path, a 12-step run that evaluates, saves and resumes. ~30 s, no data.
  v2_train_test:
    image: carbonpoly/stemnet_v2_gpu
    environment: { DATA_DIR: /tmp/data, RESULTS_DIR: /tmp/results }
    command: ["python", "/app/tests/test_stemnet_v2_train.py"]

  # The run: 50,000 steps, val evaluation every 5,000. Resumes from
  # data/stemnet_v2/models/head_last.pth if present (V2_RESUME=0 starts over).
  v2_train:
    <<: *gpu
    image: carbonpoly/stemnet_v2_gpu
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/train.py"]

  # TreeLearn-style run: the same head plus a tree / non-tree output trained
  # on the campus_pred_B24 labels. Own checkpoints (head_tree_*.pth) and log
  # (stemnet_v2_train_tree.txt); resumes from head_tree_last.pth.
  v2_train_tree:
    <<: *gpu
    image: carbonpoly/stemnet_v2_gpu
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results, V2_TASK: base+tree,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/train.py"]

  # The trained head (default head_tree_best.pth) on the held-out blocks: the
  # detection settings tuned on val -> models/detect_params.json, then the test
  # patch scored once. GPU. -> results/stemnet_v2_validate.txt, 53_/54_ png
  v2_validate:
    <<: *gpu
    image: carbonpoly/stemnet_v2_gpu
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results, PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/validate.py"]

  # The trained head over the whole campus in 50 m blocks: one LAZ per block
  # (tree_prob, pred_tree, gate_prob, B24 label, split) in
  # data/stemnet_v2/infer/<checkpoint>/, every detected base in
  # results/stemnet_v2_infer_bases.csv. GPU. V2_INFER_BBOX limits the area.
  v2_infer:
    <<: *gpu
    image: carbonpoly/stemnet_v2_gpu
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results, PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/infer.py"]

  # Probe, no training: frozen Sonata (+/- the 12 covariance features) on a
  # 24 m val region, k-means without labels, mapped back onto the points.
  # GPU, a few minutes. -> results/stemnet_v2_segment.txt, 47_/48_ png, .ply
  v2_segment:
    <<: *gpu
    image: carbonpoly/stemnet_v2_gpu
    env_file: [.env]
    environment: { DATA_DIR: /data, RESULTS_DIR: /results,
                     PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/stemnet_v2/segment_probe.py"]

  # ---- Sonata cluster: one random square, embeddings, k-means -----------
  # Image builds FROM carbonpoly/sonata. Settings pass through from the host
  # when set (SC_SEED, SC_SQUARE, SC_K, ...; see sonata_cluster/cluster_square.py).
  sc_build:
    build: { context: ., dockerfile: sonata_cluster/Dockerfile }
    image: carbonpoly/sonata_cluster
    command: ["true"]

  # CPU self-check, synthetic scan + stand-in encoder, ~5 s, no data
  sc_test:
    image: carbonpoly/sonata_cluster
    environment: { DATA_DIR: /tmp/data, RESULTS_DIR: /tmp/results }
    command: ["python", "/app/tests/test_sonata_cluster.py"]

  # writes results/sonata_cluster/square_seed<seed>_<size>m_k<k>.laz/.png/.json
  sc_run:
    <<: *gpu
    image: carbonpoly/sonata_cluster
    env_file: [.env]
    environment:
      - DATA_DIR=/data
      - RESULTS_DIR=/results
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - SC_SOURCE
      - SC_SQUARE
      - SC_CENTER
      - SC_SEED
      - SC_K
      - SC_GRID
      - SC_TILE
      - SC_MARGIN
      - SC_COVER
      - SC_FEATURES
      - SC_GEOM_WEIGHT
      - SC_FROM
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/sonata_cluster/cluster_square.py"]

  # Bare Sonata + k-means on the tile the Sonata + SEGR notebooks used: 100 m,
  # centred on the middle of the scan's bounding box. Its embeddings do not
  # fit in RAM, so k-means is fitted on a 500k-cell sample and Sonata runs a
  # second time to label every cell. Writes square_bboxcentre_100m_k8.*
  sc_tile:
    <<: *gpu
    image: carbonpoly/sonata_cluster
    env_file: [.env]
    environment:
      - DATA_DIR=/data
      - RESULTS_DIR=/results
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - SC_CENTER=bbox
      - SC_SQUARE=100
      - SC_FEATURES=sonata
      - SC_SEED=${SC_SEED:-0}
      - SC_SOURCE
      - SC_K
      - SC_GRID
      - SC_TILE
      - SC_MARGIN
      - SC_FEAT_GB
      - SC_FIT_CELLS
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/sonata_cluster/cluster_square.py"]

  # Sonata embeddings + the 12 covariance features of Liu et al. 2026 (20 NN),
  # concatenated, on the SAME square as the newest sc_run result (SC_FROM
  # defaults to latest). Writes ..._geom.laz/.png/.json next to it.
  sc_geom:
    <<: *gpu
    image: carbonpoly/sonata_cluster
    env_file: [.env]
    environment:
      - DATA_DIR=/data
      - RESULTS_DIR=/results
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - SC_FEATURES=sonata+geom
      - SC_FROM=${SC_FROM:-latest}
      - SC_GEOM_WEIGHT
      - SC_SOURCE
      - SC_K
      - SC_GRID
      - SC_TILE
      - SC_MARGIN
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/sonata_cluster/cluster_square.py"]

  # ---- SegmentAnyTree result rendering (CPU, reuses prep image) ----------
  sat_render_raw:
    image: carbonpoly/prep
    environment: { EXPERIMENT: raw, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_sat_output.py"]

  sat_render_masked:
    image: carbonpoly/prep
    environment: { EXPERIMENT: masked, DATA_DIR: /data, RESULTS_DIR: /results }
    volumes: [ ./data:/data, ./results:/results ]
    command: ["python", "/app/render_sat_output.py"]
